<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Pakistan Jobs Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .login-box {
      background: white;
      width: calc(100% - 48px);
      max-width: 380px;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 5px 25px #0001;
    }
    h2 { color: #14532d; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      border: 0;
      background: #15803d;
      color: white;
      font-weight: bold;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Pakistan Jobs Hub</h2>
    <p>Admin Login</p>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Admin email address" required>
      <input id="password" type="password"
        placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p id="message" role="status"></p>
  </div>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://vmsigpjevwljjzxorwcm.supabase.co',
      'sb_publishable_zMf1quKorjkYdJo6yk2QyA_wSPkdm2U'
    );

    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = 'Signing in...';

      const { data, error } = await supabase.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      });

      if (error) {
        message.textContent = 'Login failed: ' + error.message;
        return;
      }

      message.textContent =
        'Login successful. Admin access must be verified next.';
    });
  </script>
</body>
</html>
